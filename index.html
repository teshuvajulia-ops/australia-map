/* Layout: header (logo, city and language switches), full-height map, event list beside it (below the map on phones) */
:root{
  --ink:#10262e;
  --muted:#5b6f77;
  --line:#d9e2e5;
  --bg:#f3f7f8;
  --card:#ffffff;
  --accent:#0b7a75;
  --accent-ink:#ffffff;
  --sun:#f2b134;
  --danger:#b3261e;
  --font:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--ink);background:var(--bg);display:flex;flex-direction:column;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;min-width:0;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.logo{width:48px;height:48px;flex:none;background:#fff;border-radius:50%;padding:6px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.logo .sun{fill:var(--sun)}
.logo .pin{fill:var(--accent)}
.logo .tick{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.brandtext{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.wordmark{font-weight:800;font-size:1.25rem;letter-spacing:-.02em}
.wordmark b{color:var(--sun);font-weight:800}
.brandtext small{color:rgba(255,255,255,.92);font-size:.8rem;font-weight:500;margin-top:3px}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toggle{display:inline-flex;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:3px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.toggle button{border:0;background:transparent;padding:7px 18px;border-radius:999px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.toggle button[aria-pressed="true"]{background:#fff;color:var(--accent);text-shadow:none}
.toggle.lang button{padding:7px 12px;font-size:.9rem}

.main{flex:1;min-height:0;display:flex}
aside{width:360px;max-width:42vw;display:flex;flex-direction:column;background:var(--card);border-inline-end:1px solid var(--line);min-height:0}
.asidehead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 12px;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700}
.asidehead span{color:var(--muted);font-weight:500;font-size:.9rem}
.clock{flex-basis:100%;font-weight:500;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.clock strong{color:var(--accent);font-weight:700}
#list{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1}
#list li{border-bottom:1px solid var(--line);display:flex;align-items:stretch}
.item{flex:1;min-width:0;display:flex;gap:12px;align-items:flex-start;text-align:start;background:transparent;border:0;padding:12px 16px}
.item:hover{background:var(--bg)}
.item .em{font-size:1.7rem;line-height:1.1}
.item .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.item .tx b{font-weight:700}
.item .tx small{color:var(--muted);font-size:.85rem;overflow-wrap:anywhere}
.empty{padding:24px 16px;color:var(--muted)}
.rowtools{display:flex;flex-direction:column;justify-content:center;gap:4px;padding:4px 8px}
.rowtools button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 10px;font-size:.8rem}
.rowtools .del{color:var(--danger)}

#map{flex:1;min-width:0;direction:ltr;background:#dfe9ec;position:relative}
.pin-wrap{width:40px;height:48px;cursor:pointer}
.mapboxgl-popup-content{border-radius:12px;padding:14px 16px;font-family:var(--font)}
.pinshape{width:40px;height:40px;background:#fff;border:3px solid var(--accent);border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;box-shadow:0 3px 8px rgba(16,38,46,.35)}
.pinshape span{transform:rotate(45deg);font-size:19px;line-height:1}
.pop{text-align:start;font-family:var(--font)}
.pop h3{margin:0 0 4px;font-size:1.05rem}
.pop .meta{color:var(--muted);font-size:.85rem;margin:0 0 6px}
.pop p{margin:0 0 8px;font-size:.92rem;overflow-wrap:anywhere}
.pop .links{display:flex;gap:8px;flex-wrap:wrap}
.pop a{display:inline-block;padding:6px 12px;border-radius:8px;background:var(--accent);color:#fff !important;text-decoration:none;font-weight:700;font-size:.85rem}
.pop a.alt{background:var(--bg);color:var(--ink) !important;border:1px solid var(--line)}

/* Admin mode (open the site with #admin). Admin screens stay in Hebrew. */
.fab{position:fixed;inset-block-end:max(16px,env(safe-area-inset-bottom,0px));inset-inline-start:16px;z-index:1000;background:var(--sun);color:var(--ink);border:0;border-radius:999px;padding:12px 20px;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.25);direction:rtl}
.publishbar{position:fixed;inset-inline:0;inset-block-end:0;z-index:999;background:var(--ink);color:#fff;padding:10px 16px max(10px,env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:.9rem;direction:rtl}
.publishbar button{background:var(--sun);color:var(--ink);border:0;border-radius:8px;padding:8px 14px;font-weight:800}
.overlay{position:fixed;inset:0;z-index:2000;background:rgba(16,38,46,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.publishbar[hidden],.fab[hidden],.overlay[hidden]{display:none}
.sheet{background:var(--card);border-radius:16px;width:100%;max-width:520px;max-height:100%;overflow-y:auto;padding:20px;direction:rtl;text-align:start}
.sheet h2{margin:0 0 12px;font-size:1.2rem}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-weight:700;font-size:.9rem}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;width:100%}
.field textarea{min-height:70px;resize:vertical}
.ltr{direction:ltr;text-align:left}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.emojis{display:flex;flex-wrap:wrap;gap:6px}
.emojis button{font-size:1.4rem;border:2px solid var(--line);background:#fff;border-radius:10px;padding:4px 8px}
.emojis button[aria-pressed="true"]{border-color:var(--accent);background:#e4f3f2}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 18px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.msg{min-height:1.3em;font-size:.9rem;color:var(--muted)}
.msg.err{color:var(--danger)}

@media (max-width:720px){
  .main{flex-direction:column-reverse}
  aside{width:100%;max-width:none;height:40%;border-inline-end:0;border-top:1px solid var(--line)}
  .two{grid-template-columns:1fr}
  .wordmark{font-size:1.1rem}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto !important}}
</style>
</head>
<body>
<header>
  <a class="brand" href="./" aria-label="To Do Australia">
    <svg class="logo" viewBox="0 0 48 48" role="img" aria-hidden="true">
      <circle class="sun" cx="38" cy="10" r="6"/>
      <path class="pin" d="M24 4C15.2 4 8 11 8 19.6c0 11.2 13.2 22.6 15.1 24.2a1.4 1.4 0 0 0 1.8 0C26.8 42.2 40 30.8 40 19.6 40 11 32.8 4 24 4z"/>
      <path class="tick" d="M16 20l6 6 10-11"/>
    </svg>
    <span class="brandtext"><span class="wordmark">To Do <b>Australia</b></span><small id="sub"></small></span>
  </a>
  <div class="controls">
    <div class="toggle" role="group" aria-label="City" id="cityToggle">
      <button type="button" data-city="melbourne" aria-pressed="true"></button>
      <button type="button" data-city="sydney" aria-pressed="false"></button>
    </div>
    <div class="toggle lang" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true" lang="en">EN</button>
      <button type="button" data-lang="he" aria-pressed="false" lang="he">עברית</button>
    </div>
  </div>
</header>

<div class="main">
  <aside>
    <div class="asidehead"><div id="cityname"></div><span id="count"></span><div class="clock" id="clock" aria-live="off"></div></div>
    <ul id="list"></ul>
  </aside>
  <div id="map" role="application"></div>
</div>

<!-- Admin: only visible when the address ends with #admin -->
<button type="button" class="fab" id="addBtn" hidden>＋ אירוע חדש</button>
<div class="publishbar" id="pubbar" hidden>
  <span>יש שינויים שעוד לא פורסמו באתר.</span>
  <button type="button" id="dlBtn">הורדת events.json</button>
</div>
<div class="overlay" id="overlay" hidden>
  <form class="sheet" id="form" autocomplete="off">
    <h2 id="formTitle">אירוע חדש</h2>
    <div class="two">
      <div class="field"><label for="f-city">עיר</label>
        <select id="f-city"><option value="melbourne">מלבורן</option><option value="sydney">סידני</option></select></div>
      <div class="field"><label for="f-date">תאריך</label><input id="f-date" type="date"></div>
    </div>
    <div class="field"><label for="f-title-en">שם האירוע באנגלית (מוצג בממשק האנגלי)</label><input class="ltr" id="f-title-en" type="text"></div>
    <div class="field"><label for="f-title">שם האירוע בעברית</label><input id="f-title" type="text"></div>
    <div class="two">
      <div class="field"><label for="f-time">שעה (לא חובה)</label><input class="ltr" id="f-time" type="text" placeholder="19:30"></div>
      <div class="field"><label for="f-emoji">אימוג'י לסמן</label><input id="f-emoji" type="text" maxlength="12" value="🎭"></div>
    </div>
    <div class="field"><div class="emojis" id="emojis" role="group" aria-label="אימוג'י מוצעים"></div></div>
    <div class="field"><label for="f-address">כתובת (באנגלית)</label><input class="ltr" id="f-address" type="text" placeholder="Federation Square, Flinders St, Melbourne" required></div>
    <div class="field"><label for="f-desc-en">תיאור באנגלית</label><textarea class="ltr" id="f-desc-en"></textarea></div>
    <div class="field"><label for="f-desc">תיאור בעברית</label><textarea id="f-desc"></textarea></div>
    <div class="field"><label for="f-url">קישור (לא חובה)</label><input class="ltr" id="f-url" type="url" placeholder="https://"></div>
    <div class="msg" id="formMsg" role="status"></div>
    <div class="actions">
      <button type="button" class="btn" id="cancelBtn">ביטול</button>
      <button type="submit" class="btn primary" id="saveBtn">מצא על המפה ושמור</button>
    </div>
  </form>
</div>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.8.0/mapbox-gl.js"></script>
<script>
(function(){
'use strict';

var CITIES = {
  melbourne: {center:[-37.8136,144.9631], zoom:12, q:'Melbourne, Victoria, Australia'},
  sydney:    {center:[-33.8688,151.2093], zoom:12, q:'Sydney, New South Wales, Australia'}
};

var I18N = {
  en: {dir:'ltr', locale:'en-AU',
    sub:"What's on in Melbourne and Sydney",
    melbourne:'Melbourne', sydney:'Sydney',
    count:function(n){ return n===1 ? '1 event' : n+' events'; },
    localTime:function(c){ return 'Local time in '+c; },
    diff:function(h){ return h===0 ? 'same time as Israel' : Math.abs(h)+(Math.abs(h)===1?' hour ':' hours ')+(h>0?'ahead of Israel':'behind Israel'); },
    empty:'No events in this city yet.',
    details:'Details', directions:'Directions',
    mapLabel:'Events map',
    noToken:'Mapbox token missing. Open index.html and paste your public token in place of PASTE_YOUR_PUBLIC_TOKEN_HERE.'},
  he: {dir:'rtl', locale:'he-IL',
    sub:'מה קורה עכשיו במלבורן ובסידני',
    melbourne:'מלבורן', sydney:'סידני',
    count:function(n){ return n+' אירועים'; },
    localTime:function(c){ return 'שעה ב'+c; },
    diff:function(h){ return h===0 ? 'אותה שעה כמו בישראל' : (Math.abs(h)===1?'שעה ':Math.abs(h)+' שעות ')+(h>0?'לפני ישראל':'אחרי ישראל'); },
    empty:'עדיין אין אירועים בעיר הזו.',
    details:'לפרטים', directions:'ניווט',
    mapLabel:'מפת אירועים',
    noToken:'חסר מפתח Mapbox. פתחי את index.html והדביקי את המפתח במקום PASTE_YOUR_PUBLIC_TOKEN_HERE.'}
};
var QUICK = ['🎭','🎵','🍷','🍴','☕','🎨','🎪','🎉','⚽','🏖️','🛍️','🌿','📸','🎬','🍺','🧘'];

var admin = location.hash === '#admin';
var events = [], city = 'melbourne', dirty = false, editingId = null;
var markers = {};
var lang = 'en';

function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function safeUrl(u){return /^https?:\/\//i.test(u||'') ? u : '';}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
function t(){ return I18N[lang]; }
/* Text of an event in the current language. Falls back to the other language if one is missing. */
function tx(e,f){
  var en = e[f+'_en'], he = e[f];
  return lang==='en' ? (en||he||'') : (he||en||'');
}
function fmtDate(d){
  if(!d) return '';
  var dt = new Date(d+'T12:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString(t().locale,{weekday:'long',day:'numeric',month:'long'});
}

/* Live clock for the selected city. Melbourne and Sydney share the same time zone rules, but each city
   uses its own IANA zone so this stays correct if that ever changes. */
var TZ = {melbourne:'Australia/Melbourne', sydney:'Australia/Sydney'};
function tzOffsetMin(tz, now){
  var p = new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric'}).formatToParts(now);
  var o = {}; p.forEach(function(x){ o[x.type]=parseInt(x.value,10); });
  return (Date.UTC(o.year,o.month-1,o.day,o.hour,o.minute,o.second) - Math.floor(now.getTime()/1000)*1000) / 60000;
}
function tickClock(){
  var el = $('#clock'); if(!el) return;
  try{
    var now = new Date(), tz = TZ[city], loc = t().locale;
    var day = new Intl.DateTimeFormat(loc,{timeZone:tz,weekday:'long',day:'numeric',month:'long'}).format(now);
    var hm = new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(now);
    var hrs = Math.round((tzOffsetMin(tz,now) - tzOffsetMin('Asia/Jerusalem',now)) / 60);
    el.innerHTML = esc(t().localTime(t()[city])) + ': <strong>' + esc(day) + ', <bdi dir="ltr">' + esc(hm) + '</bdi></strong> · ' + esc(t().diff(hrs));
  }catch(e){ el.textContent = ''; }
}
setInterval(tickClock, 15000);

/* Date and time line. The time stays left-to-right so ranges like 22:00–05:00 read correctly in Hebrew. */
function whenHtml(e){
  var parts = [];
  if(e.date) parts.push(esc(fmtDate(e.date)));
  if(e.time) parts.push('<bdi dir="ltr">'+esc(e.time)+'</bdi>');
  return parts.join(' · ');
}

/* Map */
/* Your public Mapbox token (starts with pk.). Paste it here in place of the placeholder text. */
var MAPBOX_TOKEN = 'pk.eyJ1IjoidGVzaHV2YWp1bGlhIiwiYSI6ImNtd2NtbzllZTA0Y2EzMHNoMTJ1dDI3cmMifQ.GPpx-wmBop9tpMQgtJpUwQ';
mapboxgl.accessToken = MAPBOX_TOKEN;
var map = new mapboxgl.Map({
  container:'map',
  style:'mapbox://styles/mapbox/streets-v12',
  center:[CITIES[city].center[1], CITIES[city].center[0]],
  zoom:CITIES[city].zoom
});
map.addControl(new mapboxgl.NavigationControl({showCompass:false}));
var tokenNote = null;
if(MAPBOX_TOKEN.indexOf('PASTE')===0){
  tokenNote = document.createElement('div');
  tokenNote.style.cssText = 'position:absolute;z-index:5;inset:12px 12px auto 12px;background:#fff3cd;color:#10262e;padding:10px 14px;border-radius:10px;font-weight:700';
  $('#map').appendChild(tokenNote);
}

function popupHtml(e){
  var when = whenHtml(e);
  var h = '<div class="pop" dir="'+t().dir+'"><h3>'+esc(tx(e,'title'))+'</h3>';
  if(when) h += '<p class="meta">'+when+'</p>';
  h += '<p class="meta" dir="ltr" style="text-align:start">'+esc(e.address)+'</p>';
  var d = tx(e,'desc');
  if(d) h += '<p>'+esc(d)+'</p>';
  h += '<div class="links">';
  var u = safeUrl(e.url);
  if(u) h += '<a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+t().details+'</a>';
  h += '<a class="alt" href="https://www.google.com/maps/search/?api=1&query='+e.lat+','+e.lng+'" target="_blank" rel="noopener noreferrer">'+t().directions+'</a>';
  return h + '</div></div>';
}

function cityEvents(){
  return events.filter(function(e){return e.city===city;}).sort(function(a,b){return (a.date||'').localeCompare(b.date||'');});
}

function render(){
  Object.keys(markers).forEach(function(k){ markers[k].remove(); });
  markers = {};
  var list = cityEvents();
  var ul = $('#list'); ul.innerHTML = '';
  $('#cityname').textContent = t()[city];
  $('#count').textContent = t().count(list.length);
  tickClock();
  if(!list.length){
    var li0 = document.createElement('li'); li0.className='empty'; li0.textContent=t().empty;
    ul.appendChild(li0);
  }
  list.forEach(function(e){
    var el = document.createElement('div');
    el.className = 'pin-wrap'; el.title = tx(e,'title');
    el.innerHTML = '<div class="pinshape"><span>'+esc(e.emoji||'📍')+'</span></div>';
    var popup = new mapboxgl.Popup({offset:[0,-48],maxWidth:'270px'}).setHTML(popupHtml(e));
    var m = new mapboxgl.Marker({element:el,anchor:'bottom'}).setLngLat([e.lng,e.lat]).setPopup(popup).addTo(map);
    markers[e.id] = m;
    var li = document.createElement('li');
    var b = document.createElement('button'); b.type='button'; b.className='item';
    b.innerHTML = '<span class="em">'+esc(e.emoji||'📍')+'</span><span class="tx"><b>'+esc(tx(e,'title'))+'</b><small>'+whenHtml(e)+'</small><small dir="ltr" style="text-align:start">'+esc(e.address)+'</small></span>';
    b.addEventListener('click',function(){
      map.flyTo({center:[e.lng,e.lat],zoom:Math.max(map.getZoom(),14),duration:700});
      if(!m.getPopup().isOpen()) m.togglePopup();
    });
    li.appendChild(b);
    if(admin){
      var tl = document.createElement('div'); tl.className='rowtools'; tl.dir='rtl';
      var be = document.createElement('button'); be.type='button'; be.textContent='עריכה';
      be.addEventListener('click',function(){ openForm(e); });
      var bd = document.createElement('button'); bd.type='button'; bd.className='del'; bd.textContent='מחיקה';
      bd.addEventListener('click',function(){
        if(bd.dataset.sure!=='1'){ bd.dataset.sure='1'; bd.textContent='בטוחה?'; return; }
        events = events.filter(function(x){return x.id!==e.id;});
        markDirty(); render();
      });
      tl.appendChild(be); tl.appendChild(bd); li.appendChild(tl);
    }
    ul.appendChild(li);
  });
}

function fitCity(){
  var list = cityEvents();
  if(list.length){
    var b = new mapboxgl.LngLatBounds();
    list.forEach(function(e){ b.extend([e.lng,e.lat]); });
    map.fitBounds(b,{padding:60,maxZoom:14.5,duration:0});
  } else {
    map.jumpTo({center:[CITIES[city].center[1],CITIES[city].center[0]], zoom:CITIES[city].zoom});
  }
}

/* Language and city switches */
function applyLang(){
  var d = document.documentElement;
  d.lang = lang; d.dir = t().dir;
  $('#sub').textContent = t().sub;
  $('#map').setAttribute('aria-label', t().mapLabel);
  document.querySelectorAll('#cityToggle button').forEach(function(b){
    b.textContent = t()[b.dataset.city];
    b.setAttribute('aria-pressed', b.dataset.city===city ? 'true':'false');
  });
  document.querySelectorAll('.toggle.lang button').forEach(function(b){
    b.setAttribute('aria-pressed', b.dataset.lang===lang ? 'true':'false');
  });
  if(tokenNote) tokenNote.textContent = t().noToken;
  render();
}
function setLang(l){
  lang = (l==='he') ? 'he' : 'en';
  lsSet('lang', lang);
  applyLang();
}
function setCity(c){
  city = c;
  document.querySelectorAll('#cityToggle button').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.city===c ? 'true':'false'); });
  render(); fitCity();
}
document.querySelectorAll('#cityToggle button').forEach(function(b){
  b.addEventListener('click',function(){ setCity(b.dataset.city); });
});
document.querySelectorAll('.toggle.lang button').forEach(function(b){
  b.addEventListener('click',function(){ setLang(b.dataset.lang); });
});
window.addEventListener('resize',function(){ map.resize(); });

/* Loading events */
function load(){
  return fetch('events.json',{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('no file'); return r.json(); })
    .catch(function(){ return []; })
    .then(function(data){
      events = Array.isArray(data) ? data : [];
      if(admin){
        var d = lsGet('draft-events');
        if(d){ try{ events = JSON.parse(d); dirty = true; }catch(e){} }
      }
    });
}

/* Admin */
function markDirty(){ dirty = true; lsSet('draft-events', JSON.stringify(events)); $('#pubbar').hidden = false; }

function geocode(address, c){
  var cc = CITIES[c];
  var u = 'https://api.mapbox.com/search/geocode/v6/forward?q=' + encodeURIComponent(address + ', ' + cc.q) +
          '&limit=1&country=au&language=en&proximity=' + cc.center[1] + ',' + cc.center[0] +
          '&access_token=' + encodeURIComponent(MAPBOX_TOKEN);
  return fetch(u).then(function(r){ return r.json(); }).then(function(j){
    if(!j || !j.features || !j.features.length) return null;
    var co = j.features[0].geometry.coordinates;
    return {lat:co[1], lng:co[0]};
  });
}
function firstGrapheme(s){
  s = (s||'').trim();
  if(!s) return '📍';
  try{ var seg = new Intl.Segmenter(undefined,{granularity:'grapheme'}); return Array.from(seg.segment(s))[0].segment; }
  catch(e){ return Array.from(s)[0]; }
}
function setEmoji(v){
  $('#f-emoji').value = v;
  document.querySelectorAll('#emojis button').forEach(function(b){ b.setAttribute('aria-pressed', b.textContent===v ? 'true':'false'); });
}
function openForm(e){
  editingId = e ? e.id : null;
  $('#formTitle').textContent = e ? 'עריכת אירוע' : 'אירוע חדש';
  $('#f-city').value = e ? e.city : city;
  $('#f-date').value = e ? (e.date||'') : '';
  $('#f-time').value = e ? (e.time||'') : '';
  $('#f-title').value = e ? (e.title||'') : '';
  $('#f-title-en').value = e ? (e.title_en||'') : '';
  $('#f-address').value = e ? e.address : '';
  $('#f-desc').value = e ? (e.desc||'') : '';
  $('#f-desc-en').value = e ? (e.desc_en||'') : '';
  $('#f-url').value = e ? (e.url||'') : '';
  setEmoji(e ? e.emoji : '🎭');
  $('#formMsg').textContent=''; $('#formMsg').className='msg';
  $('#overlay').hidden = false;
  $('#f-title-en').focus();
}
function closeForm(){ $('#overlay').hidden = true; editingId = null; }

function initAdmin(){
  $('#addBtn').hidden = false;
  if(dirty) $('#pubbar').hidden = false;
  var box = $('#emojis');
  QUICK.forEach(function(em){
    var b = document.createElement('button'); b.type='button'; b.textContent=em; b.setAttribute('aria-pressed','false');
    b.addEventListener('click',function(){ setEmoji(em); });
    box.appendChild(b);
  });
  $('#f-emoji').addEventListener('input',function(){
    var v = $('#f-emoji').value;
    document.querySelectorAll('#emojis button').forEach(function(b){ b.setAttribute('aria-pressed', b.textContent===v.trim() ? 'true':'false'); });
  });
  $('#addBtn').addEventListener('click',function(){ openForm(null); });
  $('#cancelBtn').addEventListener('click',closeForm);
  $('#overlay').addEventListener('click',function(ev){ if(ev.target===$('#overlay')) closeForm(); });

  $('#dlBtn').addEventListener('click',function(){
    var blob = new Blob([JSON.stringify(events,null,2)],{type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'events.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); },1000);
    dirty = false; lsDel('draft-events'); $('#pubbar').hidden = true;
  });

  $('#form').addEventListener('submit',function(ev){
    ev.preventDefault();
    var msg = $('#formMsg'), btn = $('#saveBtn');
    var c = $('#f-city').value, address = $('#f-address').value.trim();
    var titleHe = $('#f-title').value.trim(), titleEn = $('#f-title-en').value.trim();
    if((!titleHe && !titleEn) || !address){ msg.className='msg err'; msg.textContent='חסרים שם אירוע (באנגלית או בעברית) וכתובת.'; return; }
    var ex = editingId ? events.filter(function(x){return x.id===editingId;})[0] : null;
    btn.disabled = true; msg.className='msg'; msg.textContent='מחפשת את הכתובת על המפה…';
    var coordsP = (ex && ex.address===address && ex.city===c) ? Promise.resolve({lat:ex.lat,lng:ex.lng}) : geocode(address,c);
    coordsP.then(function(g){
      if(!g){ msg.className='msg err'; msg.textContent='לא מצאתי את הכתובת. נסי להוסיף מספר בית ושם פרבר, באנגלית.'; return; }
      var obj = {
        id: ex ? ex.id : 'e'+Date.now(), city:c,
        title:titleHe, title_en:titleEn,
        date:$('#f-date').value, time:$('#f-time').value.trim(), address:address,
        desc:$('#f-desc').value.trim(), desc_en:$('#f-desc-en').value.trim(),
        url:safeUrl($('#f-url').value.trim()),
        emoji:firstGrapheme($('#f-emoji').value), lat:g.lat, lng:g.lng
      };
      if(ex) Object.assign(ex,obj); else events.push(obj);
      markDirty(); closeForm(); setCity(c);
      if(markers[obj.id]){ map.flyTo({center:[obj.lng,obj.lat],zoom:15,duration:700}); markers[obj.id].togglePopup(); }
    }).catch(function(){
      msg.className='msg err'; msg.textContent='החיפוש נכשל. בדקי חיבור לאינטרנט ונסי שוב.';
    }).then(function(){ btn.disabled = false; });
  });
}

lang = (lsGet('lang')==='he') ? 'he' : 'en';
load().then(function(){
  if(admin) initAdmin();
  applyLang();
  fitCity();
});
})();
</script>
</body>
</html>
