<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{TITLE}} · {{CITY}} | CITYSIDE</title>
<meta name="description" content="{{DESC_SHORT}}">
<link rel="canonical" href="{{PAGE}}">
<meta property="og:type" content="website"><meta property="og:site_name" content="CITYSIDE">
<meta property="og:title" content="{{TITLE}} · {{CITY}}"><meta property="og:description" content="{{DESC_SHORT}}">
<meta property="og:url" content="{{PAGE}}"><meta property="og:image" content="{{OG_IMG}}">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#FDF3E1">
<link rel="icon" type="image/png" href="/icon-192.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Heebo:wght@500;700&display=swap" rel="stylesheet">
<script type="application/ld+json">{{LD}}</script>
<style>
:root{--bg:#FDF3E1;--ink:#C23416;--text:#3a1d18;--muted:#8a6b64;--card:#fff;--line:rgba(194,52,22,.18)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',Heebo,system-ui,sans-serif;line-height:1.5;padding:env(safe-area-inset-top) 0 40px}
.wrap{max-width:620px;margin:0 auto;padding:0 16px}
header{padding:18px 0 10px}header img{height:34px;display:block}
.crumb{display:block;margin:6px 0 14px;font-size:.82rem;font-weight:700;color:var(--ink);text-decoration:none}
.hero{width:100%;height:220px;object-fit:cover;border-radius:18px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(194,52,22,.08)}
.em{font-size:2rem}.cats{display:block;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--muted);margin-top:4px}
h1{font-size:1.55rem;line-height:1.2;margin:8px 0 12px;text-wrap:balance}
.row{display:flex;gap:10px;margin:8px 0;font-size:.95rem}.row i{font-style:normal;flex:none}
p.desc{margin:14px 0}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.facts div{background:rgba(194,52,22,.08);border-radius:12px;padding:8px 12px;font-size:.85rem}.facts b{display:block;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.btns{display:grid;gap:10px;margin-top:18px}
.btn{display:block;text-align:center;text-decoration:none;font-weight:800;font-size:.95rem;border-radius:14px;padding:13px 14px;border:1.5px solid var(--ink);color:var(--ink);background:#fff;font-family:inherit;cursor:pointer}
.btn.main{background:var(--ink);color:#fff}.btn.wa{background:#1fa855;border-color:#1fa855;color:#fff}.btn.ghost{border-color:var(--line);color:var(--muted)}
.foot{margin:26px 0 0;text-align:center;font-size:.82rem;color:var(--muted)}.foot a{color:var(--ink);font-weight:800}
@media (prefers-color-scheme:dark){:root{--bg:#1d0f0c;--text:#f6e7e1;--muted:#c4a39a;--card:#2a1612;--line:rgba(255,160,130,.2);--ink:#ff7a58}.btn{background:#2a1612}.btn.main{color:#1d0f0c}}
</style></head><body>
<div class="wrap">
<header><a href="/"><img src="/logo-cityside.png" alt="CITYSIDE"></a></header>
<a class="crumb" href="/">← All {{CITY}} events on the map</a>
{{IMG_TAG}}
<main class="card">
<span class="em">{{EMOJI}}</span><span class="cats">{{CATS}}</span>
<h1>{{TITLE}}</h1>
<div class="row"><i>📅</i><span>{{WHEN}}</span></div>
<div class="row"><i>📍</i><span>{{ADDRESS}}</span></div>
<p class="desc">{{DESC}}</p>
<div class="facts">{{FACTS}}</div>
<div class="btns">
<a class="btn main" href="{{APPLINK}}">🗺 See it on the map</a>
{{WA_BTN}}
<button class="btn" id="cal" type="button">📅 Add to calendar</button>
<a class="btn" href="{{SHARE}}" target="_blank" rel="noopener">🙋 Come with me! Share on WhatsApp</a>
<a class="btn" href="{{MAP}}" target="_blank" rel="noopener">Directions (Google Maps)</a>
{{MORE_BTN}}
</div></main>
<p class="foot">Found on <a href="/">CITYSIDE</a> · Don't miss the city, don't miss the people.</p>
</div>
<script src="/cityside-ics.js"></script>
<script>
var EV={{EVJSON}};
document.getElementById('cal').addEventListener('click',function(){
  if(!window.CSIcs||!window.CSIcs.download(EV,{url:'{{PAGE}}'})) this.textContent='No upcoming date yet';
});
</script>
</body></html>
