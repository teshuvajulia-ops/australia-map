<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Events &amp; run clubs in {{CITYNAME}} | CITYSIDE</title>
<meta name="description" content="{{DESC}}">

<meta property="og:title" content="Events &amp; run clubs in {{CITYNAME}} | CITYSIDE"><meta property="og:description" content="{{DESC}}">
<meta property="og:url" content="{{PAGE}}"><meta property="og:image" content="https://cityside.app/img/og.jpg">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" type="image/png" href="/icon-192.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Heebo:wght@500;700&display=swap" rel="stylesheet">
<script type="application/ld+json">{{LD}}</script>
<style>
:root{--bg:#2a1d28;--ink:#f5b1eb;--text:#f5b1eb;--muted:#b896b3;--card:#36263a;--line:#4d3a4c;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',Heebo,system-ui,sans-serif;line-height:1.5;padding:env(safe-area-inset-top) 0 40px}
.wrap{max-width:620px;margin:0 auto;padding:0 16px}
header{padding:18px 0 10px}header img{height:34px;display:block}
.crumb{display:block;margin:6px 0 14px;font-size:.82rem;font-weight:700;color:var(--ink);text-decoration:none}
.hero{width:100%;height:220px;object-fit:cover;border-radius:18px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(245,177,235,.1)}
.em{font-size:2rem}.cats{display:block;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--muted);margin-top:4px}
h1{font-size:1.55rem;line-height:1.2;margin:8px 0 12px;text-wrap:balance}
.row{display:flex;gap:10px;margin:8px 0;font-size:.95rem}.row i{font-style:normal;flex:none}
p.desc{margin:14px 0}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.facts div{background:rgba(245,177,235,.1);border-radius:12px;padding:8px 12px;font-size:.85rem}.facts b{display:block;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.btns{display:grid;gap:10px;margin-top:18px}
.btn{display:block;text-align:center;text-decoration:none;font-weight:800;font-size:.95rem;border-radius:14px;padding:13px 14px;border:1.5px solid var(--ink);color:var(--ink);background:var(--card);font-family:inherit;cursor:pointer}
.btn.main{background:#388fe6;border-color:#388fe6;color:#1d1220}.btn.wa{background:#1fa855;border-color:#1fa855;color:#fff}.btn.ghost{border-color:var(--line);color:var(--muted)}
.foot{margin:26px 0 0;text-align:center;font-size:.82rem;color:var(--muted)}.foot a{color:var(--ink);font-weight:800}
.list{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:10px}
.list a{display:flex;gap:12px;align-items:flex-start;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.list .em{font-size:1.5rem;line-height:1}.list b{display:block;font-size:1rem}.list span{display:block;font-size:.84rem;color:var(--muted)}
h2{font-size:1.15rem;margin:26px 0 4px}.lead{margin:6px 0 16px;color:var(--text)}
</style></head><body>
<div class="wrap">
<header><a href="/"><img src="/logo-cityside.png" alt="CITYSIDE"></a></header>
<main>
<h1>Events &amp; run clubs in {{CITYNAME}}</h1>
<p class="lead">{{INTRO}}</p>
<div class="btns">
<a class="btn main" href="/?city={{SLUG}}">🗺 See {{CITYNAME}} on the map</a>
{{WA_BTN}}
</div>
<h2>Coming up</h2>
<ul class="list">{{UPCOMING}}</ul>
<h2>Every week</h2>
<ul class="list">{{WEEKLY}}</ul>
<p class="foot">Want this in your inbox? <a href="https://buttondown.com/cityside" target="_blank" rel="noopener">Get the weekly CITYSIDE letter</a> · <a href="{{OTHERPAGE}}">Events in {{OTHERNAME}}</a></p>
</main>
</div>
</body></html>
